name: Naslov i opis PR-a

# Naslov PR-a postaje commit na dev (squash merge), pa mora biti u formatu
#   tip: opis        npr.  feat: izdvajanje pčela iz slika košnice
# PR prema dev mora u opisu imati "Closes #<broj>" ili "Refs #<broj>".

on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  naslov:
    name: 'Naslov u formatu "tip: opis"'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            perf
            ci
            release
          requireScope: false
          subjectPattern: ^\S.*$
          subjectPatternError: Opis iza "tip:" ne smije biti prazan.

  povezan-issue:
    name: 'Povezan issue (Closes/Refs #)'
    if: github.base_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Provjera opisa
        env:
          OPIS: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$OPIS" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[[:space:]]+#[0-9]+'; then
            echo "✅ PR je povezan sa issueom."
          else
            echo "::error::U opisu PR-a nedostaje 'Closes #<broj>' ili 'Refs #<broj>'."
            exit 1
          fi
